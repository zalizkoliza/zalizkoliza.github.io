<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough)" fill="none" stroke="#231f20" stroke-linecap="round">
    <circle cx="300" cy="300" r="268" stroke-width="7" stroke-dasharray="1500 200" transform="rotate(-20 300 300)"/>
    <circle cx="300" cy="300" r="262" stroke-width="3" stroke-dasharray="900 700" transform="rotate(95 300 300)" opacity=".8"/>
  </g>
</svg>
